# =============================================================================
# NATS JetStream configuration — Vantage Portal MSSP
#
# Subject namespace conventions:
#   alerts.{tenant_id}.{severity}.{category}
#   rmm.{tenant_id}.{agent_id}.heartbeat
#   rmm.{tenant_id}.{agent_id}.telemetry
#   soc.{tenant_id}.incident.{state}
#
# Elixir/Phoenix backend connects here via NATS client on port 4222.
# =============================================================================

# Client connections
port: 4222

# HTTP monitoring endpoint (metrics, varz, connz, subsz, etc.)
http_port: 8222

# Server name for cluster identification
server_name: vantage-nats-1

# Maximum message payload (default 1MB; increase for large telemetry blobs)
max_payload: 4MB

# Connection limits
max_connections: 64000
max_subscriptions: 0
max_pending: 67108864

# Logging
log_time: true
debug: false
trace: false

# Slow consumer threshold
max_slow_consumers: 10

# Ping/pong keepalive
ping_interval: "2m"
max_pings_out: 2

# JetStream persistence configuration
jetstream {
  # Persistent storage directory (mapped to Docker volume)
  store_dir: /data/jetstream

  # In-memory stream limit per server
  max_memory_store: 1GB

  # File-backed stream limit per server
  max_file_store: 10GB

  # Optional: domain for JetStream cluster (useful when connecting multiple nodes)
  # domain: vantage
}

# =============================================================================
# Authorization — development uses no auth for local compose convenience.
# Production: supply NATS_NKEY_SEED or TLS client certs via compose override.
# =============================================================================
# authorization {
#   token: "REPLACE_WITH_SECURE_TOKEN"
# }
